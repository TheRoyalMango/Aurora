 BLR_emergency_powers:0 "Emergency Powers"
 BLR_emergency_powers_desc:0 ""
 BLR_military_dictatorship:0 "Military Dictatorship"
 BLR_strength_in_democracy:0 "Strength in Democracy"
 BLR_strength_in_democracy_desc:0 "Some say we can only find the strength to liberate ourselves by relying on Poland, or Russia, or even a dictator. We know otherwise. Belarus is a free and democratic, and that is where we draw our strength."
 BLR_women_on_the_frontline:0 "Women on the Frontline"
 BLR_women_on_the_frontline_desc:0 ""
 BLR_request_access_through_polesie:0 "Request Acess Through Polesie"
 BLR_mozr_front:0 "The Siege of Homiel"
 BLR_mozr_front_desc:0 "The Siege of Homiel began almost as soon as the civil war started. The city contains much of our industry that we were able to seize during the uprising, and thus is of vital importance to the longevity of our cause. We should fortify the streets and reinforce our units there to ensure we can keep the city and its industry under our control."
 BLR_swamp_foxes:0 "Swamp Foxes"
 BLR_swamp_foxes_desc:0 "Fighting in Mazyr and Pinsk has given us experience in swamp fighting that no other nation possesses. We need to leverage this advantage and form units specialized to the terrain commanded by an equally terrain-specialized leader."
 BLR_enlist_white_russians:0 "Invite Boris Savinkov to Belarus"
