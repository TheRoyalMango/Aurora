 BLR_liberation:0 "Long Live Belarus!"
 BLR_liberation_desc:0 ""
 father_bulak:0 "Father Bulak-Balakhovich"
 jewish_ta_condem:0 "JTA Condemnation"
 blr34_accept_ttp:0 "Opens the door for Belarusia to conduct further diplomacy with us down the line, such as trade deals and an alliance, provided they do not pivot to Poland instead."
 blr34_deny_ttp:0 "The regiment will disband and join them anyway, but won't be able to take their arms with them. Democratic Belarus will not be able to conduct any further diplomacy with us."
 BLR_support_from_lithuania:0 "Prepare the Belarusian Units in Lithuania"
 BLR_support_from_lithuania_desc:0 "The 1st Belarusian regiment was a Belarusian national military formation in the army of the Republic of Lithuania in 1918-1919, managed by the Ministry of Belarusian Affairs of Lithuania. It was demobilized after the creation to the Byelorusian SSR to avoid tensions but remains organized and equipped."
 LIT_BLR_regiment_yes:0 "Lithuania transfered their §Y1st Belarusian Regiment to us§!"
 BLR_support_from_lithuania_ttp:0 "Creates an experienced §Yinfantry regiment§! upon the start of the civil war. They will be fully equipped by Lithuania if they accept our request. Otherwise, they will arrive without equipment!"
 BLR_smuggle_weapons_to_peasants:0 "Peasant Party of the Green Oak"
 BLR_smuggle_weapons_to_peasants_desc:0 "The Belarusian Peasant Party of Green Oak is a Belarusian political organization that has led the anti-Bolshevik peasant movement since 1919. They already have recognized our government in exile since 1921, and have been preparing peasant militias to rise up alongside us."
 BLR_intermarium_support:0 "Intermarium Support"
 BLR_intermarium_support_desc:0 "Our planned uprising is largely possible because the Ukrainian and Polish governments have either supported our cause or simply fained ignorance to our activites and organizing. We should request a donation of arms to our cause, and also secure assurances of further support."
 BLR_mobilize_student_circles:0 "Belarusian Teachers' Union"
 BLR_mobilize_student_circles_desc: "The Belarusian Teachers' Union is a professional and political organization of Belarusian teachers since 1907. It set the goal of reorganizing the education system on a broad democratic basis for the rise of civic self-awareness and the culture of the people. Exiled by the Germans and then the communists, inviting the union to return will be beneficial to our R&D."
 #Belarusian students, despite not being adults during our initial fight for independence, now champion our cause. These student activists hand out flyers and graffiti the white-red-white flag on the side of buildings in Minsk. We should organize a selection of them to aid in our R&D department.
 BLR_secure_the_border_guard_corp:0 "Secure the Border Guard Corps"
 BLR_secure_the_border_guard_corp_desc:0 "Formed in the 20s, this corps was meant to provide a first line of defense against invaders and to stop people, goods, and ideas from entering Belarus. However, the poorly-paid recruits that spend long periods of time on rotation have since indulged in the anti-communist ideas they frequently come in contact with. A meeting with their commanders will secure their support."
 BLR_sabotage_communist_factories:0 "Sabotage Communist Arms Factories"
 BLR_sabotage_communist_factories_desc:0 "Minsk is home to many communist supporters as well as the communist government and loyal military units. Thus it is very unlikely we would seize the city in our uprising. We should instead focus on sabotaging the arms factories there to hinder the communist cause upon the start of the civil war."
 BLR_out_of_the_shadows_and_into_the_light:0 "Out of the Shadows and into the Light"
 BLR_out_of_the_shadows_and_into_the_light_desc:0 "It's Morbin Time"
 BLR_Belarusian_civil_war:0 "The Belarusian Civil War"
 BLR_impending_civil_war:0 "Impending Civil War"
 BLR_impending_civil_war_desc:0 "Years of unrest has pushed the country past the tipping point. It is no secret that those who oppose the communist rule, supported by the Intermarium, are about to launch their uprising. The question is, which side will we take?"
 BLR_polish_gen_staff:0 "Polish General Staff"
 BLR_collectivized_farms:0 "Collectivized Farms"
 LIT_vinius_war:0 "Battles in Vilnius" #loc for doctrine boni from end of LIT-RLC war
 BLR_industrializing_urban_centers:0 "Industrializing Urban Centers"
 BLR_lithuanian_grain:0 "Grain Imports"
 BLR_lithuanian_grain_desc:0 "Grain imports have allowed us to ignore domestic agriculture for a time being, allowing men usually working on farms to join the military. The surplus of food also is providing our people a sense of security and keeping our soldiers well fed."
 BLR_agrarian_society:0 "Large Agrarian Economy"
 BLR_industrializing_society:0 "Industrializing Society"
 BLR_grain_exports_to_belarus:0 "Grain Exports to Belarus"
 BLR_agrarian_society2:0 "Prioritized Agrarian Economy"
 BLR_agrarian_society3:0 "Prioritized Agrarian Economy"
 BLR_belarus_national_army_ns:0 "Army of the People's Republic"
 BLR_belarus_national_army_ns_desc:0 "Come, we shall march in joint endeavour Through the free spaces of our native land; May freedom dwell with us forever, And every onslaught we'll withstand. \n\nLong live the Belarusian spirit brave, The bold free spirit of our nation! White-red-and-white the banners wave Above our fight for liberation. \n\nTo arms! May happiness and freedom For our brave people in the fight be won; Too long in torment we were bleeding... To battle, each and everyone! \n\nAh, may the Belarusian name and might Be seen and heard from near and far By all who'd rule us without right, Or first dare challenge us to war. \n\nCome, brothers, we march on to fortune, Let thunder roar still louder in its strife! We'll bring to birth from anguished torture For our Republic a new life!"
