 BLR_swamp_fox_random_generals_tt:0 "1 random general will gain §YSwamp Fox§!"
 BLR_urban_assault_specialist_random_generals_tt:0 "1 random general will gain §YUrban Assault Specialist§!"
 BLR_peasants_ttp:0 "Adds an extra §Ymilitia battalion§! to BNR milita units upon the start of the civil war"
 BLR_council_of_sluchchyna:0 "Council of Sluchchyna"
 BLR_council_of_sluchchyna_desc:0 "The Belarusian Council of Sluchchyna was created during the Slutsk Uprising in 1920 to coordinate the fight against the communists alongside the army of Bulak-Balachowicz. Today, they still exist in exile as a way to coordinate resistance in the Slutsk area. We will make sure the organization is ready to re-raise their two infantry regiments in Slutsk when the time is right."
 BLR_council_of_sluchchyna_ttp:0 "§YTwo milita regiments§! will be created by the BNR to the southwest of Slutsk upon the start of the civil war."
 BLR_border_guards_ttp:0 "The §YBryhada Pamieznaj Achovy§! and §YLiohkaj Piachotnaj Bryhada§! will join the BNR upon the start of the civil war. They will start with §Yincreased equipment priority.§!"
 BLR_polish_equipment_shipments_ttp:0 "§CUnlocks§! £decision_icon_small §Cto recieve§! §Ymonthly arms shipments§! §Cfrom Poland, for a period of 6 months.§!§O \n This focus will cost political power if we have not invited a Polish general staff!§!"
 BLR_heavy_equipment_shipments_ttp:0 "Unlocks £decision_icon_small to recieve §Ymonthly artillery and armor shipments§! from Poland, for a period of 3 months.\n "
 BLR_pol_blr_rail_ttp:0 "§YAlso increases the Warsaw-Brest-Livtosk railway by one level§!"
 BLR_polish_officer_ttp:0 "\n§RRelying heavily on Poland may have far-reaching consequences in the future!§!"
 BLR_direct_polish_support_ttp:0 "\n§RSuch a massive request to Poland may have far-reaching consequences in the future!§!"
 BLR_polish_river_monitors:0 "Request River Monitors for the Pripyat"
 BLR_polish_river_monitors_desc:0 ""
 idea_BLR_river_navy:0 "River Monitors"
 BLR_poles_in_Belarusian_uniforms_ttp:0 "A Polish §Yartillery regiment§! and 3 Polish §Yinfantry divisions§! will be created in Hrodna, equipped with Polish arms." #, all equipped with Polish weapons.
 LIT_invited_to_BLR_faction:0 "§CLithuania joins our faction§!"
 BLR_polish_gen_staff_event:0 "We will invite a Polish General Staff to our country to help organize the military. If they accept, we will gain a national spirit and our claims on Bialystok and Polesie will be removed. §OIf Poland denies our request we will bypass the §YThose who Went to Die for the Motherland§! focus.§!"
 BLR_central_lit_ttp:0 "\n§YPolish seperatists§! seize control of §YVilnius§!. §YLithuania§! may take advantage of the situation and invade the city!"
 BLR_non_submission_to_poland:0 "Those Who Went to Die for the Motherland"
 BLR_non_submission_to_poland_desc:0 ""Those who went to die so that the Motherland would live" was the motto of the First Slutsk Rifle Regiment in 1920. It is from them who we draw our inspiration from. They were not created by Poland, nor by Russia. It was true Belarusians who rose up for their nation, for an independent Belarus. We can only truly free liberate Belarus if we do not fall back into Polish or Russian claws."
