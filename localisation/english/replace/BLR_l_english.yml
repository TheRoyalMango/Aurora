 BLR_society_for_aid:0 "Society for Aid to Victims of War"
 BLR_society_for_aid_desc:0 "Formed in 1915, the Belarusian Society for Aid to Victims of War provided public warfare for refugees and reconstruction to war-ravaged areas. In 1916 it was expanded to also provide Belarusian education. After moving to Vilnius, it was disbanded in the 1920s. Recreating it is a sensible course of action to ensure the welfare of our citizens."
 BLR_society_of_belarusian_youth:0 "Society of Belarusian Youth"
 BLR_society_of_belarusian_youth_desc:0 "The Community of Belarusian Youth was a Belarusian youth organization from 1919 to 1921. It was dedicated to education of the Belarusian language, history, geography, folklore, and developing sports and physical culture. With Belarusian liberation in hand, recreating the society is a good move to counter years of communist propoganda Belarusian youth have been suffering."
