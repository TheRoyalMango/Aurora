 BLR_violence_in_vilna:0 "Ethnic Violence in Vilnia"
 BLR_violence_in_vilna_desc:0 "Wilno in Polish, Vilnia in Belarusian, and Vilnius in Lithuanian. Whatever its called, the city is divided. Lithuanian partisans seeking to liberate their historic capital openly engage in street firefights with Polish partisans hoping to join the city with Poland. People do not ask whether Belarus can hold the city, but rather if Lithuania will invade it if the strengthening Polish partisans declare the city for Poland."
 BLR_estonian_airplane_purchase:0 "Estonian Airplane Deal"
 BLR_estonian_airplane_purchase_desc:0 "Recent history in Estonia has shown their willingness to sell military surplus or act as a middle man between the UK and buyers. We will ask them to purchase planes from the UK using their contacts with London and then re-sell them to us. They'll make a profit of course, but they need the funds for their army and we need the planes."
 BLR_latvian_tank_deal:0 "Latvian Tank Deal"
 BLR_latvian_tank_deal_desc:0 "Purchased in the 1920s and 1930s, Latvia accumulated a number of light tanks from various nations. While mostly obsolete, some are well-designed foreign models. The majority have cannons, and some Lativan-ordered British designs have high-velocity cannons. Sending a mission to Latvia for the purchase of these models will boost our ability to destroy communist tanks and break enemy lines."
 BLR_generals_return:0 "BNR Restored"
 BLR_military_commission:0 "Belarusian Military Commission"
 BLR_military_commission_desc:0 "The Belarusian Military Commission was a body for the training of Belarusians in the Polish army in 1919-1921 created by a Belarusian government acting with the BNR Rada. While the commission was disbanded in 1921 with the end of hostilities, our ties with Poland allow us to recreate the commission to train a new Belarusian army and mobilize Belarusians in Poland."
 blr_military_commission_ns:0 "Belarusian Military Commission"
 BLR_direct_polish_support:0 "Request Direct Intervention"
 BLR_direct_polish_support_desc:0 ""
 lit_support_blr:0 "Lithuanian Support"
 polish_support:0 "Polish Support"
 ukrainian_support:0 "Ukrainian Support"
 BLR_bind_belarus:0 "By sending Savinkov to Belarus, we will support their fight against our common enemy. If they re-create the 3rd Russian Army, we may bind them to an offensive alliance against Moscow when we march north."
 BLR_union_peoples_volunteer_army_ttp:0 "This focus will grant more units if §Y[RUS.GetNameDefCap]§! has agreed to support us" 
 BLR_intermarium_support_ttp:0 "Grants §Y500 infantry equipment§! from Poland and Ukraine each to the BNR upon the start of the civil war if they accept"
