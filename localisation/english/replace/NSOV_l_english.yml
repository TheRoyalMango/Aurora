 newsov.4.t:0 "Barracks & Armory Raided!"
 newsov.4.d:0 "Anarchist partisans have staged an attack on a small military base housing a barracks and armory. After killing the guards in a skirmish, the barracks was chained from the outside and set on fire. The armory was promptly raided, seizing many small arms which will undoubtably strenghten the anarchists.\n\nAbout 50 soldiers died in the fire and skirmish, only a few survived. An NKVD investigation has put fault on the surviving quartermaster. He was found to have fired 4 rounds of ammuniton from his pistol but only hit 1 of the enemy - clearly evidence of collusion and wrecking."
 newsov.4.a:0 "Shoot the quartermaster resposible"

 newsov.5.t:0 "NKVD Foil Anarchist Operation"
 newsov.5.d:0 ""
 newsov.5.a:0 "Excellent work!"

 aurora_news.6.t:0 "Yakov Sverdlov Dies"
 aurora_news.6.desc:0 "Yakov Sverdlov has died earlier today in Moscow at the age of 50. Following a political visit to Oryol, he caught an illness believed to be either typhus or the Spanish flu. He initially dismissed the disease and continued his duties as General Secretary until he lost consciousness and died two days later. With his death, Iosif Stalin is expected to succeed him as General Secretary. Mostly unknown to those outside of Soviet Russia, Stalin is known to be a supporter of Sverdlov's camp but with a more heavy handed approach. Time will tell what sort of leader he will be."
 aurora_news.6.a:0 "The Man of Steel Rises"

