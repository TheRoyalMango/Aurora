 SOV_the_fourth_revolution:0 "The Fourth Revolution"
 SOV_the_fourth_revolution_desc:0 "1905 was the first, the Feburary and October Revolutions the second and third. But now it is time for the Fourth Revolution, for Anarchism to finally prevail!"
 SOV_yakov_sverdlov:0 "Yakov Sverdlov"
 SOV_victors_of_the_civil_war:0 "Home of the Revolution and Victors of the Civil War"
 SOV_legacy_of_war_communism:0 "Legacy of War Communism"
 SOV_legacy_of_war_communism_desc:0 "The failure of War Communism weighs on the minds of many, with memories of the bloody Kronstadt Rebellion and futile collectivization being a stain on the Bolshevik’s image. While the New Economic Policy has rectified some of War Communism’s most tragic effects, many are still opposed to full collectivization."
 SOV_anarchist_militias:0 "Anarchist Militias"
 SOV_anarchist_militias_desc:0 "While seemingly defeated years prior, anarchist militants continue to damage the RSFSR’s authority. Growing stronger and stronger by the day, the militias must be quelled before they can do any lasting damage."
 SOV_anarchist_militias_2:0 "Anarchist Militias"
 SOV_factionalism_in_the_rkpb:0 "Factionalism in the RKP(b)"
 SOV_factionalism_in_the_rkpb_desc:0 "The Russian Communist Party is split into three distinct factions: the orthodox Center, led by Comrade Sverdlov, the collectivist and revolutionary Left, led by Comrade Trotsky, and the pro-NEP moderate Right, led by Comrade Bukharin. If either the Left or the Right were to gain too much influence the consequences could be staggering"
 SOV_soviet_political_crisis: "[SOV.GetAdjective] Political Situation"
 SOV_soviet_political_crisis_desc:0 "It's a mess"
 SOV_collapse_in_the_south:0 "Deteriorating Situation in the South"
 SOV_collapse_in_the_south_desc:0 "With the end of the Civil War, open resistance to communist rule has ceased in the North Caucasus. However, the failure of De-Cossackization and War Communism means our grip on the region is tenuous at best. With rising anarchist activity in and around Moscow, the ability for the central government to respond to events in the North Caucasus is threatened. It may be prudent to grant the local Red Banner military district autonomy & authority to handle the situation, especially if we are unable to respond due to anarchist action."
 SOV_deploy_nkvd_to_fight_anarchists_ttp:0 "Has at least one unit with Military Police support in the selected state."
 SOV_deploy_nkvd_to_fight_anarchists1:0 "NKVD Operation in Moscow"
 SOV_deploy_nkvd_to_fight_anarchists2:0 "NKVD Operation in Leningrad"
 SOV_get_command_power:0 "Dedicate Operational Resources to the NKVD"
 SOV_anarchists_planning_attack:0 "Anarchists Planning Attack"
 SOV_anarchists_planning_attack_desc:0 "Successfull anarchist raids on military armories will result in the next attack and the impending uprising happening sooner. NKVD foiling of an attack will delay both."
 SOV_anarchist_activity:0 "Anarchist Activity"
 SOV_anarchist_activity_desc:0 "Ever since we turned on the anarchists at the end of the civil war, they have only grown in popularity and in threat. Anarchist Militias, such as the Black Guards, constantly sabotage us at every turn and attack communist soldiers and supporters. According to the NKVD, the anarchist militias even plan on launching a large scale uprising sometime in the near future. This will most definately plunge our country into civil war once more."