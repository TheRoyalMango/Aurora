 KHA_mountain_cavalry_partisan_detachment:0 "Mountain Cavalry Partisan Detachment"
 KHA_mountain_cavalry_partisan_detachment_desc:0 "Led by Ataman Ivan Solovyov, the detachment consists of anti-communists partisans who fought under Solovyov against the Bolsheviks during the Russian civil war. The main body, based in the taiga, was organized on the principle of a regular military unit, in which an evening roll call was held, military uniforms and weapons were used. There was a tricolor banner with the inscription 'For Faith, Tsar and Fatherland' embroidered on it. \n\nThe Solovyovites call themselves 'white partisans', proclaimed the slogans 'For the Constituent Assembly', 'For non-party councils and against communists', 'For the liberation of foreigners.'"
 KHA_ivan_solovyov:0 "Ivan Solovyov"
 KHA_ivan_solovyov_desc:0 "Ataman Ivan Nikolaevich Solovyov has been the leader of the anti-communist movement in Siberia in the early 1920s; hero of Khakass folklore. After fighting in the Great War and in Kolchak's army, Solovyov started an anti-communist partisan group in Khakassia ranging from 200-500 or more people at different times throughout the early 1920s. More than 70 percent of them were the Khakass poor, dissatisfied with the food tax policy. Some of the Solovyovites lived in families, or found wives for themselves by appointment of the ataman. The main body, based in the taiga, was organized on the principle of a regular military unit, in which an evening roll call was held, military uniforms and weapons were used. There was a tricolor banner with the inscription 'For Faith, Tsar and Fatherland' embroidered on it. \n\nThe Solovyovites called themselves 'white partisans', proclaimed the slogans 'For the Constituent Assembly', 'For non-party councils and against communists', 'For the liberation of foreigners.'\n\nThus after Khakassia was able to gain independence thanks to the Anarchists of Altai, Solovyov became the natural leader of Russian-orientated Khakas, uniting tsarists and democratic forces. Solovyov favors integrating Khakassia into a unitied Russia under a non-totalitarian regime."
