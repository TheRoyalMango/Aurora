 RUS_national_alliance_of_russian_solidarists:0 "Sway the NTS"
 RUS_national_alliance_of_russian_solidarists_desc:0 "The National Alliance of Russian Solidarists (Narodno-trudovoy Soyuz Rossiyskikh Solidaristov; NTS), like the RNSUV, is an organization of anti-communist Russians who split from the ROVS. With a maximum age requirement of 30, the NTS believes the ROVS is is too stagnant and old guard to lead a successful liberation of Russia. While still adhering to non-predetermination, they hold many fascist-like belief and could thus be swayed to our side."
 RUS_mission_to_germany:0 "Mission to Germany"
 RUS_axis_investments:0 "Axis Investments"
 RUS_invite_the_wrangel_opposition:0 "Invite Exiled Nationalists"
 RUS_invite_the_wrangel_opposition_desc:0 "General Wrangel and the Crimean Mandate exiled certain Russian generals who contributed to defeat of the White Army or who behaved irresponsibly to civilians and their soldiers. Now with Wrangel placed in house arrest, we can invite these people back to serve under us."
 RUS_the_great_white_purge:0 "Purge the White Movement"
 RUS_the_great_white_purge_desc:0 "In order to secure our position, we must dismiss and exile well known figures of the White Movement who may oppose our regime."
 RUS_nts_spirit:0 "National Alliance of Russian Solidarists"
 RUS_nts_spirit_desc:0 "The National Alliance of Russian Solidarists (Narodno-trudovoy Soyuz Rossiyskikh Solidaristov; NTS), like the RNSUV, is an organization of anti-communist Russians who split from the ROVS. With a maximum age requirement of 30, the NTS believes the ROVS is is too stagnant and old guard to lead a successful liberation of Russia."
