 RUS_invite_denikin:0 "Offer Denikin Command"
 RUS_invite_denikin_desc:0 "In the wake of the collapse of the White Army, Anton Denikin fled South Russia in 1920. Despite his flight, his supporters begged him to return, but he refused, leading to the acension of Pyotr Wrangel to save the army. However, times have now changed and perhaps Denikin can be persuaded to return to service.\nRemoves an extra 25 political power if §YPyotr Wrangel§! is the country leader"
