 RUS_state_guard:0 "State Guard"
 RUS_state_guard_desc:0 "The State Guard was a militarized body of civil administration in 1919–1920 in the territories controlled by the Armed Forces of the South of Russia. It performed the functions of political, criminal, and territorial police, combining the features of the apparatus of the Ministry of Internal Affairs , the gendarmerie , and the territorial army."
