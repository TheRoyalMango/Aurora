 RUS_union_state_with_belarus:0 "Union State with Belarus"
 rus77ttp:0 "Since we already negotiated Russian support, this is our only choice."
 RUS_ils_ne_passeront_pas:0 "Oni Ne Proydut!"
 RUS_ils_ne_passeront_pas_desc:0 "Oni Ne Proydut: They Shall Not Pass! In our desperate situation to stop the enemy advance, we will employ civilian labor to contruct fortifications in every city across all of Russia. Every city will become a fortress where our brave defenders will bleed the invaders dry."
