 RUS_military_police_court_of_justice:0 "Military Police Court of Justice"
 RUS_military_police_court_of_justice_desc:0 "Our soldiers are treated far too harshly by their officers than is neccessary. Furthurmore, the officers are turning a blind eye to looting and crimes, even sometimes taking part. Military police detachments and a military court of justice will handle the worst offenses to prevent harsh punishments and oversee occupations."
