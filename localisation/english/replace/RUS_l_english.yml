 RUS_order_of_st_nicholas:0 "Order of St. Nicholas the Wonderworker"
 RUS_guchkovs_second_purge:0 "Guchkovian Army Purge"
 RUS_guchkovs_second_purge_desc:0 "During the Great War, Alexander Guchkov led an army purge to fix the Russian Army's problems of old guard & inflexible officers. While it faced critizicsm for shaking up the army during wartime and causing disorganization, it still partly accomplished its original goal."
 RUS_no_pass_ttp:2 "Place §Y1 Fort§! in all provinces with §Y3 Victory Points§! in controlled states.\nPlace §Y3 Forts§! in all provinces with §Y10 Victory Points§! in controlled states.\nPlace §Y4 Forts§! in all provinces with §Y30 Victory Points§! or more in controlled states.\n"
 RUS_moscow_directive:0 "Moscow Directive"
 RUS_moscow_directive_desc:0 "The Moscow Directive during the civil war was Anton Denikin's all-or-nothing assault on the heart of Soviet Russia. Despite getting rather close, the offensive stalled and the Red counterattack combined with Anarchist partisans delt a massive blow from which the White Army simply never recovered from. This time, we'll do it right."
 RUS_cadet_academy:0 "Russian Military Academies" #spirit
 RUS_cadet_academy_desc:0 "During and after the civil war, many White Guard military academies emerged. We can merge the Konstantinovsky, Aleksandrovskoye, Kornilovskoye, Kuban Alekseevskoye, and the Sergievsk artillery school with the Crimean Cadet Corps and Foreign Higher Military Scientific Courses to create a unified system of cadet schools and general staff academies. We'll staff the schools with Ex-Imperial officers too old to fight, and fill the desks with the sons of the White Army."
 RUS_war_academy:0 "Merge Emgiree Military Schools" #focus
 RUS_war_academy_desc:0 "During and after the civil war, many White Guard military academies emerged. We can merge the Konstantinovsky, Aleksandrovskoye, Kornilovskoye, Kuban Alekseevskoye, and the Sergievsk artillery school with the Crimean Cadet Corps and Foreign Higher Military Scientific Courses to create a unified system of cadet schools and general staff academies. We'll staff the schools with Ex-Imperial officers too old to fight, and fill the desks with the sons of the White Army."
 RUS_winter_clothing:0 "White, Like the Snow"
 RUS_winter_clothing_desc:0 ""
 RUS_green_like_forests:0 "Green, Like the Leaves"
 RUS_green_like_forests_desc:0 ""
 RUS_factionalism:0 "Factionalism"
 RUS_winter_clothing_idea:0 "Winter Clothing"
 RUS_black_sea_fishing:0 "State Fishing"
 RUS_black_sea_fishing_desc:0 "Pyotr Makhrov in his famous special report to General Wrangel outlined many things, but one of them was the involvement the population in the supply of the army by organizing state fishing. In the absence of enough local agriculture in Crimea to feed an army alone, relying on fishing in the Black Sea may prove vital."
 RUS_desperate_measures:0 "Desperate Measures"
 SOV_communist_side:0 "Soviet Russia"
 SOV_anarchist_side:0 "Free Territory of Russia"
 RUS_desperate_measures_desc:0 "In this desperate situation, we must take measures we had prevously thought impossible. Anything that can be done to stem the invasion must be done. Every bridge, every rail, every road gives the enemy mobility. Fields flooded... buildings booby-trapped... crops aflame... even dams blown. Anything is worth the price of saving the nation..., right?"
 RUS_organization_of_the_partisans:0 "Organization of the Partisans"
 RUS_organization_of_the_partisans_ttp:0 "Our partisans will be more effective if we completed the focus §YReinforce Cossack Units§!."
 RUS_brusilov_once_more:0 "Brusilov Once More"
 RUS_brusilov_once_more_desc:0 "Our finest hour in The Great War was arguably the Brusilov Offensive named after Alexei "The Iron General" Brusilov, which nearly wiped Austria-Hungary out of the war. Young officers from the General Staff Academy have drawn up plans for a massive offensive in his name. It is expected to shatter the enemy lines with modern tactics, as Brusilov had done. "
 RUS_brusilov_ttp:0 "§YUnlocks§! £decision_icon_small §Yto launch a second, massive, Brusilov Offensive to shatter the enemy lines. Our own army will be exhausted in the aftermath.§!"
 RUS_union_for_the_motherland_ttp:0 "§YUnlocks§! £decision_icon_small §Yto launch uprisings in Soviet Russia§!"
 RUS_west_siberian_revolt_aid_ttp:0 "§CUnlocks§! £decision_icon_small §Cto assume leadership of the West Siberian Revolt§!"
 RUS_denikin_ttp:0 "Unlocks £decision_icon_small to invite §YAnton Denikin§! back into the army."
 RUS_french_tanks_ttp:0 "A French-Equipped unit with §Y2 Light Armor§!, §Y2 Medium Armor§!, and §Y3 Motorized Infantry§! Battalions with various support companies will spawn."
 #We will gain a §Ylicense production§! for the §YH-35§! as well.
 RUS_german_tanks_ttp:0 "A German-Equipped unit with §Y4 Light Armor§! and §Y2 Motorized§! Battalions with various support companies will spawn. It will be equipped with the Panzer I Ausf. A."
 #We will gain a §Ylicense production§! for the §YPanzer II Ausf. a§! as well.
 RUS_english_tanks_ttp:0 "A §YEnglish-Equipped tank unit§! based off of the historical English Experimental Mechanized Force will be created."
 #We will also gain a §Ylicense production§! for the §YMedium Mark. II§!
