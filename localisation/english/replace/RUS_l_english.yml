 RUS_tarnovsky_airforce_shooting_school:0 "Tarnovsky's Anti-Aircraft Schools"
RUS_tarnovsky_airforce_shooting_school_desc:0 "Vasily Tarnovsky during the Great War and Civil War founded two anti-aircraft schools in Crimea. The Officers' School for Firing at the Air Fleet located in Yevpatoria and the Air Force Shooting Courses in Kerch. Closed by the Crimean Mandate, we can re-open the schools to help counter the threat of enemy aircraft."
 RUS_mobile_anti_air:0 "Mobile Anti-Air"
 RUS_mobile_anti_air_desc:0 "During the Great War, Vasily Tarnovsky substantiated the idea that future anti-aircraft units must have high mobility to counter the threat posed by enemy aircraft. Indeed, his mobile unit became the first Russian anti-aircraft ace. Despite his death in 1926, his ideas live on. Cadets from his schools have gone further and proposed anti-aircraft weapons be mounted on armored chassis."
