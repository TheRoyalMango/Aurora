 RUS_fractured_white_movement:0 "Fractured White Movement"
 RUS_fractured_white_movement_desc:0 "The White Movement was fractured along petty personal grudges and aspirations durig the civil war by the likes of Semyonov, Kolchak, Kerensky, and others. Unite the following White States (the ones that still exist) to improve this spirirt: §CMurmansk, Transcaspia and Okhotsk. Buryatia, Mongolia, and Priamurye are potential white allies, but not related to this national spirit.§!"
