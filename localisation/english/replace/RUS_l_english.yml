 prikaze_reforms_ttp:0 "\nGrants §Gcompliance§! to every Soviet §Ynon-core state§! we control\n"
 RUS_centralize_the_airforce:0 "Centralize the Airforce"
 RUS_centralize_the_airforce_desc:0 "This decision can be taken an infinite number of times as long as we have subjects with airplanes."
 airforce_centralization_ttp:0 "Transfers its entire §Yairforce§! to §Y[RUS.GetNameDefCap]§!"
 solving_horse_issue:0 "Already solving the horse shortage issue"
 RUS_merge_the_terek_host_with_kuban:0 "Merge the Kuban and Terek Cossack Hosts"
 RUS_raise_line_cossacks:0 "Raise Line Cossacks"
 RUS_raise_line_cossacks_desc:0 "This decision can be taken every 365 days"
 RUS_harness_soviet_military_industry:0 "Harness Soviet Military Industry"
 RUS_harness_soviet_military_industry_ttp:0 "§CCertain Soviet Tank & Material Equipment Military Industrial Organizations become available\n\nAll Soviet 1936 designs of airplanes and tanks become available§!"
 RUS_harness_soviet_naval_industry_tt2:0 "§CCertain Soviet Naval Military Industrial Organizations become available§!"
 RUS_harness_soviet_naval_industry_tt:0 "§CAll Soviet 1936 designs of ships become available§!"
 RUS_harness_soviet_naval_industry:0 "Harness Soviet Naval Expertise"
 RUS_harness_soviet_naval_industry_desc:0 ""
 RUS_operation_trust:0 "Internal Bolshevik Activity"
 RUS_operation_trust_desc:0 "The Bolsheviks are a shrewd group, and thus employ indirect methods of attacking the White Movement. At the most common level, factories may be sabotaged and agitators might encourage communist sympathization. However, at the most professional levels the NKVD might attempt to §Rassassinate Russian generals§!. \nTo ensure the saftey of our people and its people, it is imperative we fund the §YInner Line§! counter-intel organization, and fund the §YState Guard§! to protect our factories."
 RUS_restoring_order:0 "Restoring Order"
 RUS_restoring_order_desc:0 ""
 RUS_putilov_artillery_organization:0 "Putilov Artillery Plant"
 RUS_defense_industry_dynamic_modifier:0 "Defense Industry"
 RUS_artillery_production_focus:0 "Russian Artillery"
 RUS_move_capital_to_moscow:0 "Move the Capital to Moscow"
 RUS_restore_the_black_hundreds:0 "Restore the Black Hundreds"
 RUS_restore_the_russian_empire:0 "Revive the Russian Empire"
 RUS_russian_defence_industry:0 "The Central Military Industrial Committee"
 RUS_glory_of_the_russian_army:0 "Glory of the Russian Army"
 RUS_lessons_of_the_second_civil_war:0 "Lessons of the Second Civil War"
 #SOV_military_reorganization_ns_removal_tt:0 "This National Spirit will be removed upon completion of the focus '§Y$SOV_military_reorganization$§!'"
 RUS_recall_savinkov_from_belarus:0 "Recall Savinkov's mission from Belarus"
 RUS_prikaze_no_1:0 "Prikaze No. 1"
 RUS_prikaze_no_1_desc:0 "Prikaze - Russian word for 'order' or 'decree' which is how General Wrangel gave out directives in 1920. Today, the we have announced a new Prikaze system, starting with Prikaze No. 1: Immediate restoration of the Government of the South of Russia. Expulsion and rejection of Mandate restrictions. Recruitment offices are to re-open and the economy brought to a war-time stance. We're back."
 RUS_the_army_of_wrangel:0 "April 28th Edict: The Russian Army"
 RUS_the_army_of_wrangel_desc:0 "On April 28th, 1920, Wrangel issued an edict changing the name of the Volunteer Army to that of the Russian Army. Hoping to reconcile the White Army with forces the Volunteers had previously antagonized, this edict united the Cossacks and White Russians under a common name. The Russian Army represented an idea that the White Movement was fighting for the very idea of Russia, and gave it more legitmacy. "
 RUS_unite_south_russia:0 "Unite South Russia"
 RUS_russia_one_and_indivisible:0 "Russia One and Indivisible"
 RUS_russia_one_and_indivisible_desc:0 "Russia United, Great and Indivisible was one of the main principles of the foreign and domestic policy of the White movement (along with the principles of "non-predeterminism). It was a nationalist slogan aimed at maintaing Russia's power, meaning no cooperation with those who wished to seperate from Russia or gain significant autonomy."
 RUS_united_front:0 "United Anti-Bolshevik Front" #autonomous national units 
 RUS_united_front_desc:0 "With the collapse of the Volunteer Army in 1920, the principle of Russia United and Indivisible began to give away to principles of "federation." A major proponent of this idea was Pyotr Wrangel, who signed alliances with Ukraine and attempted to even negotiate with Nestor Makhno. Only by working together with seperatists and other movements can the White Army hope to liberate Russia."
 RUS_faction_name:0 "White Movement"
 RUS_potential_allies_in_the_caucasus:0 "Potential Allies in the Caucasus"
 RUS_connect_rail_in_north_don:0 "Connect Millerovo Rail With Mikhaylovka Rail"
 RUS_connect_rail_in_north_don_desc:0 "Without control of Volgograd, the rail line in the North Don has been split. We can send an engineer company to quickly build a by-pass so that our supply lines may reach Mikhaylovka."
 RUS_pressure_the_mountainous_republic:0 "Mission to the Mountainous Republic"
 RUS_victors_of_the_civil_war:0 "Victors of the Civil War"
 RUS_mission_to_the_don:0 "Landing in the Don"
 RUS_second_kuban_landing:0 "Second Kuban Landing"
 RUS_direct_russian_rule_in_transcaucasia:0 "Direct Russian Rule in Transcaucasia"
 RUS_march_on_tsaritsyn_once_more:0 "3 Weeks to Tsaritsyn"
 RUS_western_stepp_expidition:0 "Reach out to Transcaspia"
 RUS_the_road_to_our_allies:0 "The Road to Transcaspia"
 RUS_prevent_disorder:0 "Crack Down on Disorder & Excess"
 RUS_prevent_disorder_desc:0 "It is impossible to claim we are a disciplined army if our men are looting homes and agitators are encouraging cowardice. We will execute those convicted of the worst offenses and install proper systems to prevent disorder and excesses amongst our men. This might be unpopular amongst the men but civilians will appreciate it much more."
 RUS_fortification_effort:0 "Fortress Crimea"
 RUS_defensive_plan_ukraine:0 "Fortify the Western Border"
 RUS_supreme_leadership:0 "Maintain ROVS Neutrality" #Non-Predetermination of the ROVS
 RUS_tolerate_far_right_organizations:0 "Tolerate Far Right Organizations"
 RUS_tolerate_far_right_organizations_desc:0 "The National Alliance of Russian Solidarists (Narodno-trudovoy Soyuz Rossiyskikh Solidaristov; NTS), like the RNSUV, is an organization of anti-communist Russians who split from the ROVS. With a maximum age requirement of 30, the NTS believes the ROVS is is too stagnant and old guard to lead a successful liberation of Russia. Since they adhere non-predetermination, they can be swayed to our side despite containing many fascists."
 RUS_okhrana:0 "Okhrana"
 RUS_military_dictatorship:0 "Military Dictatorship"
 RUS_military_dictatorship_desc:0 ""
 RUS_military_dictatorship_ns:0 "Military Dictatorship"
 RUS_reign_in_the_military_dictatorship:0 "Reign in the Dictatorship"
 RUS_military_dictatorship_ns3:0 "Fascist Dictatorship"
 RUS_leverage_emigree_wealth:0 "Leverage Emigree Wealth"
 RUS_leverage_emigree_wealth_desc:0 ""
 RUS_restore_order_to_the_nation:0 "Restoring Order"
 RUS_printing_department:0 "Restoration of the Printing Department"
 RUS_printing_department_desc:0 "Recognizing the many issues of the Information Agency (OSVAG), it was replaced in March of 1920 with the Printing Department under the Government of the South of Russia. It is the only government newspaper, run by the military. It works to establish the broadest support for the private press and the selection of censors - educated and ideological."
 RUS_OSVAG:0 "OSVAG Propoganda"
 RUS_OSVAG_desc:0 "OSVAG (OSVEDOMITELNOE AGENTSTVO) was the information and propoganda agency of the Volunteer Army and later the Armed Forces of South Russia. Recreating the agency with a monopoly on state information will allow us to project the goals of our government and anti-Bolshevism upon the population."
 RUS_order_of_st_george:0 "Order of St. George"
 RUS_order_of_st_george_desc:0 "The Imperial Military Order of the Holy Great Martyr and Victorious George, or simply the Order of St George, was the highest military award of the Russian Empire. With the White Movement back in action, we can start issuing the medal once again to victorious commanders to cement both their victories and our legitimacy."
 RUS_new_volunteerism:0 "Volunteerism"
 RUS_point_blank_artillery:0 "Point Blank Artillery Tactics"
 RUS_point_blank_artillery_desc:0 "Volunteer Army units, especially Drozdovsky's division, were known for employing field artillery at point blank range for maximum damage amongst the Bolsheviks. While being very effective at shredding enemy infantry, this tactic makes the artillery vulnerable to enemy fire."
 RUS_new_volunteerism_desc:0 "Wrangel identified Volunteerism as the de facto ideology of the Volunteer Army, marked by a commitment to Russia "United and Indivisible." While Wrangel critized the inflexibility of this idea as a reason for the White Army's defeat, those who believe in a United and Indivisble Russia still follow it."
 RUS_revalue_the_ruble:0 "Revalue the Ruble"
 RUS_revalue_the_ruble_desc:0 "While devaluing the ruble saved our economy from its financial crisis in 1920 and the Great Depression that hit Crimea in 1929, the effects have been very unpopular. Revaluing the ruble will reduce our economic capabilities but will improve our stability and long term growth."
 RUS_expand_the_crimean_evacuation_stockpiles:0 "Expand the Crimean Evacuation Stockpiles"
 RUS_expand_the_crimean_evacuation_stockpiles_desc:0 "Wrangel's stockpiles of oil and coal were reserved for a Crimean evacution that never occured. With a new found need for oil for our armed forces, we should expand these stockpiles to allow us to acquire more oil."
 RUS_assume_leadership_of_west_siberian_revolt:0 "Assume Leadership of the West Siberian Revolt"
 RUS_lignite_liquefaction:0 "Domestic Refining"
 RUS_lignite_liquefaction_desc:0 ""
 RUS_support_the_peasantry:0 "Revive the All-Russian Peasant Union"
 RUS_support_the_peasantry_desc:0 "The All-Russian Peasant Union was a mass revolutionary organization uniting the peasantry and the rural intelligentsia during & before the revolution. Wrangel, and even Semyonov, recognizing the massive importance of the support of the peasantry for the army, have voiced support for reviving the union since the 1920s. We should finish the job and sign the revival into law."
 RUS_study_foreign_machine_tools:0 "Import Modern Machine Tools"
 RUS_study_foreign_machine_tools_desc:0 ""
 RUS_connect_the_villages:0 "Connect the Stanitsa"
 RUS_connect_the_villages_desc:0 "Connecting villages with new roads will allow us greater freedom of movement in these regions along with improving the stability of the country."
 RUS_open_foreign_subsidized_factories:0 "Open Foreign Subsidized Factories"
 RUS_open_foreign_subsidized_factories_desc:0 ""
 RUS_till_north_tavaria:0 "Till North Taurida"
 RUS_till_north_tavaria_desc:0 "In 1920 Wrangel launched a major offensive into North Taurida in large part to gain access to the agricultural resources there. With the Kherson region now under our control, we can finally complete this goal."
 RUS_invite_the_exiles_i:0 "Invite the Exiles"
