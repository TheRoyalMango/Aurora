 RUS_fate_of_the_predreadnoughts:0 "Fate of the Pre-dreadnoughts"
 RUS_fate_of_the_predreadnoughts_desc:0 "By the end of the civil war, we ended up with 4 pre-dreadnoughts capital ships in various states of disrepair in our possession. The Crimean Mandate tried to sell them to private scrapping companies, but these efforts were successfully blocked by former Russian Navy sailors who not only lived in these ships due to lack of housing in Crimea, but also did not want to see such a large symbol of their service go to the scrapyards. Now that we are in control of our own government again, we have the choice with what to do with the ships."
 #\n \nThe Rostislav, Tri Sviatitelia, and Dvenadsat Apostolov could all be either sold to a neighboring Black Sea power, scrapped for steel and weaponry, or simply repaired and activated into our own fleet. The Potemkin is in very bad condition, but France has expressed interest in the purchase of the ship to turn into a museum.
 RUS_scrap_a_predreadnought:0 "Scrap a Pre-dreadnought"
 RUS_scrap_a_predreadnought_desc:0 "§CIf Armored Trains and Railway Guns are both researched when selecting a ship to scrap, we will have an additional option to acquire free armored trains and a railway gun per ship.§!"
RUS_scrap_a_predreadnought_ttp:0 "\nScrapping a pre-dreadnought will grant 2 steel in Crimea for a time, but also allow us to choose the fate of their armament, including conversion into §!railway guns§! or army artillery, or the construction of §!Armored Battery No.35§!"
 RUS_sell_the_potemkin_to_a_french_mueseum:0 "Sell the Potemskin to a French Museum"
 RUS_sell_the_potemkin_to_a_french_mueseum_desc:0 "The Potemkin's condition is too poor for activation or sale, but France has expressed interest in the purchase of the ship to turn into a museum due to the historical significance of the ship."
 RUS_sell_a_predreadnought:0 "Sell a Pre-dreadnought to a Black Sea Nation"
