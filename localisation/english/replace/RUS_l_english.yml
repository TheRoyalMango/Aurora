 RUS_horse_stock_shortage_desc:0 "In the disasterous Novorossyk Evacuation, most of our cavalry was forced to leave behind their horses to make space on the ships for more people. As there are very little horses in Crimea, our cavalry and logistics are still short of horses. \n This spirit can be removed by taking  the §YRequistion Horses§! decision."
 RUS_law_on_volost_zemstvos_ttp2:0 "Grants cores on all §YKuban§! states\nGrants cores on all §YDon§! states\nGrants cores on all §YTerek§! states\nGrants cores on all §YKalmyk§! states\nGrants cores on all §YUral Cossack§! states"
