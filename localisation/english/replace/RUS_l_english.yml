 RUS_typhus_medicine:0 "Acquire & Distribute Medicine for Typhus"
 RUS_typhus_medicine_desc:0 "During the civil war, the typhus epidemic was more deadly than fighting with the Bolsheviks. Now as conflict comes to Russia once more, we are noticing new cases of typhus popping up."
 RUS_strengthened_civilian_government:0 "Russian Constituent Assembly"
 RUS_provincial_elections:0 "Council of Department Heads"
 RUS_provincial_elections_desc:0 "When Pyotr Wrangel formed his Government of the South of Russia in April 1920, he created the council of heads of departments to run the government for him. It considered the staff of institutions, their budget, draft foreign trade agreements, land and zemstvo reforms. It was quite effective, especially compared to Denikin's previous government. Thus, re-instating the council today is a logical move."
 RUS_invite_the_wrangel_opposition_ttp:0 "Russian generals previously relieved of command or exiled from the White Movement will return to Crimea"
 RUS_sofia_panina_leader_ttp:0 "Grants §Y100 political power§! if §YSofia Panina§! is the country leader"
 RUS_alexander_krivosein_leader_ttp:0 "Automatically assigns §YAlexander Krivoshein§! as an §Yadvisor§! for free if he is not the country leader"
 RUS_kub_puppet_ttp:0 "§YVasily Ivanis§! becomes the country leader\n§YVyacheslav Naumenko§!, §YFyodor Eliseev§!, §YViktor Pokrovsky§!, and §YSergei Ulagay§! leave §Y[RUS.GetNameDefCap]§! and join §Y[KUB.GetNameDefCap]§!."
 minister_of_welfare_and_education:0 "Minister of Welfare and Education"
 left_politics_right_hands:0 "Left-wing Politics with Right Hands"
 minister_of_foreign_affairs:0 "Minister of Foreign Affairs"
 RUS_democratic_military_dictatorship:0 "The Democratic Dictatorship"
 RUS_democratic_military_dictatorship_desc:0 "Largely organized by general Pyotr Makhrov, the Democratic Dictatorship is the idea of a White Army military dictatorship fighting for democracy within Russia, and above all, to reconvene the All-Russian Constituent Assembly."
 RUS_peace_with_crimean_tartars:0 "Peace with the Crimean Tartars"
 RUS_peace_with_crimean_tartars_desc:0 "The Crimean Tartars have never accepted Crimea as part of Russia. During the civil war many joined the communists who gave them promises of freedom, but most simply refused whatever government tried to rule them. We will continue what Wrangel started in 1920 and negotiate special freedoms for the Tartars in exchange for cooperation."
 RUS_free_press:0 "Freedom of the Press"
 RUS_dissolve_far_right_organizations:0 "Dissolve Far Right Organizations"
 RUS_voting_rights_for_women:0 "Solidify Women's Suffrage"
