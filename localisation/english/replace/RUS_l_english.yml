 woes_resistance_ttp:0 "\nResistance in former Soviet states can be gradually removed via the decisions unlocked by the§YState Guard§! focus\n"
 RUS_open_stockpiles:0 "Blast Open the Crimean Stockpiles"
 RUS_open_stockpiles_desc:0 "After the end of hostilities, the Entente locked up much equipment stockpiles in various secure warehouses in Sevastopol, to be used only in the case of a Soviet invasion - but in reality used to weaken the Russian Army to prevent dissent. The Entente has since left the equipment to rust and be forgotten about, with the keys to the warehouses being "misplaced." However, some enthusiastic artillery officers have proposed they can open the stockpiles forcefully with the use of some well-aimed cannon."
