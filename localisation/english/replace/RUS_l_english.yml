 RUS_russia_one_and_indivisible_ttp:0 "§OWe will demand Cossacks and local polities to accept annexation or face invasion. We won't have to bother appeasing them but we will find it harder to find allies amongst non-Russian break-away states.§!"
 RUS_united_front_ttp: "§OOffering Cossacks and local polities federation will grant us their submission, but they may demand supplies from time to time. We will also find it easier to ally with non-Russian break-away states against Bolshevism§!\n\nAllows §YBelarus§! to invite §YBoris Savinkov§! to their country and form an alliance with [RUS.GetNameDefCap]"
