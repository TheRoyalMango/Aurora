 RUS_small_arms_conversions_desc:0 "Our factories are currently busy converting our stockpiles to standarized models."
 RUS_mine_warfare:0 "Mine Warfare"
 RUS_mine_warfare_desc:0 "It is uneconomic to try and defend our entire coastline with ships. By laying minefields in strategic locations we can deter or at least damage any enemy fleet trying to close to our coasts."
 RUS_reinforce_western_naval_bases:0 "Reinforce Western Naval Bases"
 RUS_reinforce_western_naval_bases_desc:0 "The Baltic Fleet is very exposed in its bases. We should invest some resources into protecting its anchorages and improve its repair capacities."
 RUS_reinforce_northern_naval_bases:0 "Reinforce Northern Naval Bases"
 RUS_reinforce_northern_naval_bases_desc:0 "Despite being located north of the Arctic circle, Murmansk is ironically our only port that remains ice-free the entire year and has access to the open oceans. We should develop it further to allow better access to the rest of the world."
 RUS_reinforce_southern_naval_bases:0 "Reinforce Southern Naval Bases"
 RUS_reinforce_southern_naval_bases_desc:0 "The Black Sea might look like a secondary theater. But if we lose control over it, we will open up our entire southern territories up to enemy invasion, as happened in the Crimean War. We must not let this happen again, and should strengthen the naval bases in the region."
 RUS_reinforce_eastern_naval_bases:0 "Reinforce Eastern Naval Bases"
 RUS_reinforce_eastern_naval_bases_desc:0 "Even after the humiliation of 1905, the Japanese have not stopped making noises about encroaching on our territories. We must be ready for war against them, and that means strengthening our naval bases in the region."
 RUS_expand_shipbuilding_plants:0 "Expand Shipbuilding Plants"
 RUS_expand_shipbuilding_plants_desc:0 "Our geography forces us to have widely spread out shipyards to support our various fleets. Any attempt at increasing our shipbuilding capacity therefore has to be spread out as well."
 RUS_reopen_sevastopol_shipyard:0 "Re-open Sevastopol Shipyards"
 RUS_puppet_descisions:0 "A Puppet of the [RUS.GetNameDefCap]"
 RUS_puppet_descisions_desc:0 "As a Puppet of the [RUS.GetNameDefCap], we can ask them for various types of aid in strengthening our country. Keep in mind that if the [RUS.GetNameDefCap] agrees to our requests, we will lose autonomy. However, if they deny our request we will gain a small amount of autonomy."
 RUS_puppet_scavenge_for_arms:0 "Scavenge for Arms"
 RUS_puppet_scavenge_for_arms_desc:0 "Forgotten depots from previous governments and recent battlefields are bound to turn up some useable arms for our soldiers"
 RUS_order_of_st_george_ttp:0 "Unlocks the §YOrder of St. George §!medal"
 RUS_order_of_st_nicholas_ttp:0 "Unlocks the §YOrder of St. Nicholas the Wonderworker §!medal"
 rus_st_nicholas:0 "Order of St. Nicholas the Wonderworker"
 trait_rus_st_nicholas:0 "Order of St. Nicholas the Wonderworker"
 trait_rus_st_nicholas_desc:0 "The Order of St. Nicholas the Wonderworker was established by order of the Commander-in-Chief of the Armed Forces in the South of Russia, General P. N. Wrangel, in 1920. It was intended to award ranks of the Russian Army - both generals, admirals, staff and senior officers, and soldiers for initiative and valor. It replaced the Order of St. George as the highest possible military medal."
 rus_st_goerge:0 "Order of St. George"
 trait_rus_st_george:0 "Order of St. George"
 trait_rus_st_george_desc:0 "The Order of Saint George was the highest military decoration of the Russian Empire for commissioned officers and generals by Empress Catherine the Great. After the October Revolution in 1917, it was awarded by the White movement under Alexander Kolchak."
 trait_artillery_leader:0 "Artillery Leader"
 trait_artillery_leader_desc:0 "Skilled in leading artillery against enemy forces."
 trait_rus_badge_1st_kuban:0 "Badge of the First Kuban Campaign"
 trait_rus_badge_1st_kuban_desc:0 "Awarded to the participants of the legendary Ice Campaign, in which the naissant & tiny Volunteer Army successfuly evaded a Bolshevik over 5 times its size while rallying Cossacks to its cause. The event prevented the destruction of the Volunteer Army just months after its creation."
