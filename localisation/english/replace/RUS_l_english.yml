 RUS_offer_tundutov_astrakhan_ttp:0 "If we have taken the focus §YUnited Anti-Bolshevik Front§! and Kalmykia exists, we will launch an anti-communist coup in Kalmykia and make them our puppet while also declaring war on Astrakhan. If we have proclaimed §YRussia One and Indivisible§!, we will just gain a wargoal on both."
 rus10ttp:0 "The uprising in Kalmykia does not take place. Only some Kalmyks join us anyway:"
