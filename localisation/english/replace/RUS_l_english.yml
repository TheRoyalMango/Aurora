 RUS_the_mikhail_sablin:0 "The Mikhail Sablin"
 RUS_don_civil_war_ttp:0 "§OThis will cause a civil war to re-ignite in the Don. We will be forced to declare war on the Don Soviet Republic to support the White loyalists!§!"
 RUS_don_civil_war_ttp2:0 "The Don becomes independent following events in Moscow. Since the Don does not exist yet, we gain a wargoal on Soviet Russia instead. \n "
 RUS_don_civil_war_ttp3:0 "\nSparks an uprising in the Don, and §RDeclares war on [SOV.GetNameDefCap] AND the Moscow anarchists if they exist§!\n "
 RUS_kuban_landing_ttp:0 "§RDeclares war on [SOV.GetNameDefCap] AND the Moscow anarchists if they exist§!\n"
 RUS_send_arms_to_the_west_siberian_revolt:0 "Send Arms to the West Siberian Revolt"
 RUS_send_arms_to_the_west_siberian_revolt_desc:0 "The underground Tobolsk Federation was once home to White Movement ideals in the 1920s, but has since fallen under the influence of anarchist militias. By using submarines to smuggle arms to Tobolsk, we can gain influence over their councils while strengthening their fight against Moscow."
 RUS_south_east_union_cores:0 "The Don will gain cores and annex on all Kuban, Terek, Astrakhan, Mountain Republic, Kalmyk, Yaik Cossack states, as well as Abkhazia."
 RUS_integrate_the_cossacks_ttp:0 "§OEnsure that you have no expeditionary forces from any of these countries before completing the focus, or those units will be bugged.§!"
 federalize_heavy_industry_ttp:0 "We will also unlock a descision to federalize the industry of future puppets as well."
 cau_rus_ttp:0 "Restoring the Terek Cossack Host prior to this will allow us to coup the Mountain Republic and form the Union of Highlanders."
 for_holy_russia:0 "For Holy Russia"
 unite_south_russia_polities_ttp:0 "\nThis focus or event will have different effects depending on if we proclaimed §YRussia One and Indivisible§! or §YUnited Anti-Bolshevik Front.§!"
