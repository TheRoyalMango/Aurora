l_english:
 BUK_basmachi:0 "Basmachi Movement"
 BUK_basmachi_desc:0 "The Basmachi (meaning 'bandits') are a Central Asian mujahideen counter-revolutionary nationalist movement focused on defending Western Turkestan from Bolshevik invasion. Supported by the British, the irregular fighters were able to achieve independence for Transcaspia (under their White Russian allies), Khiva, and Bukhara at the end of the Russian Civil War as well as helping the Alash Orda in their independence as well. Today the Basmachi persist as the general spirit of the Central Asian people in relation to their resistance to foreign occupation."
 BUK_alim_khan:0 "Alim Khan"